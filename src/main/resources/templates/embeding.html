<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: header">
    <title>Hello</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="sb-nav-fixed">
<div th:replace="fragments/bodyHeader :: bodyHeader"></div>
<div id="layoutSidenav">
    <div th:replace="fragments/sidebar :: sidebar"></div>
    <div id="layoutSidenav_content">
        <main>
            <div class="container-fluid px-4">
                <h1 class="mt-4">LLM 학습파일 업로드</h1>
                <ol class="breadcrumb mb-4"></ol>
                <div class="card mb-4">
                    <div class="card-body">
                        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#fileUploadModal">
                            파일 업로드
                        </button>
                    </div>
                </div>
            </div>
        </main>
        <div th:replace="fragments/footer :: footer"></div>
    </div>
</div>

<!-- File Upload Modal -->
<div class="modal fade" id="fileUploadModal" tabindex="-1" aria-labelledby="fileUploadModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="fileUploadModalLabel">파일 업로드</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="fileUploadForm">
                    <div class="mb-3">
                        <label for="fileInput" class="form-label">PDF 파일 선택</label>
                        <input type="file" id="fileInput" class="form-control" accept=".pdf" required>
                    </div>
                    <div class="mb-3">
                        <label for="fileGroup" class="form-label">타입 선택</label>
                        <select id="fileGroup" class="form-select">
                            <option value="document">문서</option>
                            <option value="department">조직도</option>
                        </select>
                    </div>
                    <div id="fileDetails" class="mt-3"></div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" id="uploadButton">저장</button>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
            </div>
        </div>
    </div>
</div>

<!-- Toast Notification -->
<div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="uploadSuccessToast" class="toast align-items-center text-bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body">
                파일 업로드가 성공적으로 완료되었습니다.
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const fileInput = document.getElementById('fileInput');
        const fileDetails = document.getElementById('fileDetails');
        const uploadButton = document.getElementById('uploadButton');
        const fileUploadModal = document.getElementById('fileUploadModal');
        const uploadSuccessToast = new bootstrap.Toast(document.getElementById('uploadSuccessToast'));

        // 모달 인스턴스 초기화
        let modalInstance = new bootstrap.Modal(fileUploadModal);

        // 파일 선택 이벤트 처리
        fileInput.addEventListener('change', function () {
            const file = fileInput.files[0];
            if (file) {
                fileDetails.innerHTML = `
                <p><strong>파일명:</strong> ${file.name}</p>
                <p><strong>파일 크기:</strong> ${(file.size / 1024).toFixed(2)} KB</p>
            `;
            } else {
                fileDetails.innerHTML = '';
            }
        });

        // 파일 업로드 이벤트 처리
        uploadButton.addEventListener('click', function () {
            const file = fileInput.files[0];
            const type = document.getElementById('fileGroup').value;

            if (!file) {
                alert('파일을 선택해주세요.');
                return;
            }

            if (!type) {
                alert('타입을 선택해주세요.');
                return;
            }

            const formData = new FormData();
            formData.append('file', file);
            formData.append('type', type);

            fetch('http://0.0.0.0:8000/upload', {
                method: 'POST',
                body: formData,
            })
            .then(response => {
                if (response.ok) {
                    // Toast 표시
                    uploadSuccessToast.show();

                    // 모달 닫기
                    modalInstance.hide();

                    // 폼 초기화
                    document.getElementById('fileUploadForm').reset();
                    fileDetails.innerHTML = '';

                    // 수동으로 backdrop 및 body 클래스 제거
                    document.querySelectorAll('.modal-backdrop').forEach(backdrop => backdrop.remove());
                    document.body.classList.remove('modal-open');
                } else {
                    alert('파일 업로드에 실패했습니다.');
                }
            })
            .catch(error => {
                console.error('파일 업로드 중 오류 발생:', error);
                alert('파일 업로드 중 오류가 발생했습니다.');
            });
        });

        // 모달 이벤트 정리
        fileUploadModal.addEventListener('hidden.bs.modal', function () {
            modalInstance = new bootstrap.Modal(fileUploadModal); // 새로운 인스턴스 초기화
        });
    });
;
</script>
</body>
</html>
