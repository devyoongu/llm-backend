<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: header">
    <title>Hello</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
</head>
<body class="sb-nav-fixed">
<div th:replace="fragments/bodyHeader :: bodyHeader"></div>
<div id="layoutSidenav">
    <div th:replace="fragments/sidebar :: sidebar"></div>
    <div id="layoutSidenav_content">
        <main>
            <div class="container-fluid px-4">
                <h2 class="mt-4">부서 및 직원 정보</h2>
                <div class="card mb-4">
                    <div class="card-body">
                        DataTables is a third party plugin that is used to generate the demo table below. For more information about DataTables, please visit the
                    </div>
                </div>
                <div class="row">
                    <!-- 부서 정보 테이블 -->
                    <div class="dynamic-panel" id="departmentTablePanel">
                        <div class="card mb-4">
                            <div class="card-header">
                                <i class="fas fa-table me-1"></i>
                                부서 정보
                            </div>
                            <div class="card-body">
                                <table class="table table-bordered">
                                    <colgroup>
                                        <col span="1" style="width: 70px;">
                                        <col span="1">
                                        <col span="1">
                                        <col span="1" style="width: 100px;">
                                    </colgroup>
                                    <thead>
                                    <tr>
                                        <th>부서 ID</th>
                                        <th>부서명</th>
                                        <th>전화번호</th>
                                        <th>직원 수</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr th:each="department : ${departments}">
                                        <td th:text="${department.departmentId}"></td>
                                        <td th:text="${department.departmentName}"></td>
                                        <td> </td>
                                        <td style="text-align: center">
                                            <button type="button" class="btn btn-count btn-primary"
                                                    th:attr="data-department-id=${department.departmentId}">
                                                <span th:text="${#lists.size(department.employees)} + '명'"></span>
                                            </button>
                                        </td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    <!-- 직원 정보 슬라이드 패널 -->
                    <div class="dynamic-panel slide-panel" id="employeeDetailsPanel">
                        <div th:each="department : ${departments}" th:attr="data-department-id=${department.departmentId}" class="employee-details-card">
                            <h2 class="mt-4">직원 상세 정보</h2>
                            <button type="button" class="close-btn btn btn-danger" id="closeEmployeePanel">닫기</button>
                            <div class="card employee-card">
                                <div class="card-header">
                                    <i class="fas fa-table me-1"></i>
                                    <span th:text="'부서: ' + ${department.departmentName} + ' (직원 ' + ${#lists.size(department.employees)} + '명)'"></span>
                                </div>
                                <div class="card-body">
                                    <table class="table table-bordered">
                                        <thead>
                                        <tr>
                                            <th>직원 ID</th>
                                            <th>직원명</th>
                                            <th>담당 업무</th>
                                            <th>담당 지역</th>
                                        </tr>
                                        </thead>
                                        <tbody>
                                        <tr th:each="employee : ${department.employees}">
                                            <td th:text="${employee.employeeId}"></td>
                                            <td th:text="${employee.employeeName}"></td>
                                            <td>
                                                <ul>
                                                    <li th:each="job : ${employee.employeeJobs}" th:text="${job.jobName}"></li>
                                                </ul>
                                            </td>
                                            <td>
                                                <ul>
                                                    <li th:each="region : ${employee.employeeRegions}" th:text="${region.region}"></li>
                                                </ul>
                                            </td>
                                        </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>



                </div>
            </div>

        </main>
        <div th:replace="fragments/footer :: footer"></div>
    </div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const departmentTablePanel = document.getElementById('departmentTablePanel');
        const employeeDetailsPanel = document.getElementById('employeeDetailsPanel');
        const employeeCards = document.querySelectorAll('.employee-details-card');

        document.querySelectorAll('.btn-count').forEach(button => {
            button.addEventListener('click', function () {
                const departmentId = button.getAttribute('data-department-id');

                // 모든 카드 숨기기
                employeeCards.forEach(card => {
                    card.style.display = 'none';
                });

                // 해당 부서 ID에 해당하는 카드만 표시
                const targetCard = document.querySelector(`.employee-details-card[data-department-id="${departmentId}"]`);
                if (targetCard) {
                    targetCard.style.display = 'block';
                }

                // 부서 정보 패널과 직원 정보 패널의 애니메이션 동기화
                departmentTablePanel.classList.add('shrink');
                employeeDetailsPanel.classList.add('expand');
            });
        });

        // 이벤트 위임 방식으로 닫기 버튼 처리
        employeeDetailsPanel.addEventListener('click', function (event) {
            if (event.target.matches('.close-btn')) {
                departmentTablePanel.classList.remove('shrink');
                employeeDetailsPanel.classList.remove('expand');

                // 모든 카드 숨기기
                employeeCards.forEach(card => {
                    card.style.display = 'none';
                });
            }
        });
    });

</script>

</body>
</html>
