<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: header">
    <title>Hello</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
</head>
<body class="sb-nav-fixed" tabindex="-1">
<div th:replace="fragments/bodyHeader :: bodyHeader"></div>
<div id="layoutSidenav">
    <div th:replace="fragments/sidebar :: sidebar"></div>
    <div id="layoutSidenav_content">
        <main>
            <div class="container-fluid px-4">
                <h2 class="mt-4">부서 및 직원 정보</h2>
                <div class="card mb-4">
                    <div class="card-body">
                        DataTables is a third party plugin that is used to generate the demo table below. For more information about DataTables, please visit the
                    </div>
                </div>
                <div class="row">
                    <!-- 부서 정보 테이블 -->
                    <div class="dynamic-panel" id="departmentTablePanel">
                        <div class="card mb-4">
                            <div class="card-header">
                                <div class="d-flex justify-content-between align-items-center">
                                    <div>
                                        <i class="fas fa-table me-1"></i>
                                        부서 정보
                                    </div>
                                    <button type="button"
                                            class="btn btn-primary" 
                                            data-bs-toggle="modal" 
                                            data-bs-target="#departmentModal">
                                        부서 추가
                                    </button>
                                </div>
                            </div>
                            <div class="card-body">
                                <table class="table table-bordered">
                                    <colgroup>
                                        <col span="1" style="width: 70px;">
                                        <col span="1">
                                        <col span="1">
                                        <col span="1">
                                        <col span="1" style="width: 100px;">
                                    </colgroup>
                                    <thead>
                                    <tr>
                                        <th>부서 ID</th>
                                        <th>부서명</th>
                                        <th>전화번호</th>
                                        <th>담당업무</th>
                                        <th>직원 수</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr th:each="department : ${departments}">
                                        <td th:text="${department.departmentId}"></td>
                                        <td th:text="${department.departmentName}"></td>
                                        <td th:text="${department.mainPhone}"></td>
                                        <td>
                                            <ul>
                                                <li th:each="job : ${department.departmentJobs}" th:text="${job.jobName}"></li>
                                            </ul>
                                        </td>
                                        <td style="text-align: center">
                                            <div class="d-flex justify-content-center gap-2">
                                                <button type="button" class="btn btn-count btn-primary"
                                                        th:attr="data-department-id=${department.departmentId}">
                                                    <span th:text="${#lists.size(department.employees)} + '명'"></span>
                                                </button>
                                                <button type="button" class="btn btn-success btn-add-employee"
                                                        data-bs-toggle="modal" 
                                                        data-bs-target="#employeeModal"
                                                        th:attr="data-department-id=${department.departmentId},
                                                                 data-department-name=${department.departmentName}">
                                                    <i class="fas fa-plus"></i>
                                                </button>
                                            </div>
                                        </td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    <!-- 직원 정보 슬라이드 패널 -->
                    <div class="dynamic-panel slide-panel" id="employeeDetailsPanel">
                        <div th:each="department : ${departments}" th:attr="data-department-id=${department.departmentId}" class="employee-details-card">
                            <h2 class="mt-4">직원 상세 정보</h2>
                            <button type="button" class="close-btn btn btn-danger" id="closeEmployeePanel">닫기</button>
                            <div class="card employee-card">
                                <div class="card-header">
                                    <i class="fas fa-table me-1"></i>
                                    <span th:text="'부서: ' + ${department.departmentName} + ' (직원 ' + ${#lists.size(department.employees)} + '명)'"></span>
                                </div>
                                <div class="card-body">
                                    <table class="table table-bordered">
                                        <thead>
                                        <tr>
                                            <th>직원명</th>
                                            <th>직원 연락처</th>
                                            <th>담당 업무</th>
<!--                                            <th>담당 지역</th>-->
                                        </tr>
                                        </thead>
                                        <tbody>
                                        <tr th:each="employee : ${department.employees}">
                                            <td th:text="${employee.employeeName}"></td>
                                            <td th:text="${employee.personalPhone}"></td>
                                            <td>
                                                <ul>
                                                    <li th:each="job : ${employee.employeeJobs}" th:text="${job.jobName}"></li>
                                                </ul>
                                            </td>
                                        </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>



                </div>
            </div>

        </main>
        <div th:replace="fragments/footer :: footer"></div>
    </div>
</div>

<!-- Department Modal -->
<div class="modal fade" id="departmentModal" tabindex="-1" role="dialog" aria-labelledby="departmentModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="departmentModalLabel">부서 추가</h5>
                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Close">

                </button>
            </div>
            <div class="modal-body">
                <form id="departmentForm">
                    <div class="mb-3">
                        <label for="departmentName" class="form-label">부서명</label>
                        <input type="text" class="form-control" id="departmentName" required>
                    </div>
                    <div class="mb-3">
                        <label for="mainPhone" class="form-label">전화번호</label>
                        <input type="text" class="form-control" id="mainPhone">
                    </div>
                    <div class="mb-3">
                        <label for="parentId" class="form-label">상위부서 ID</label>
                        <input type="number" class="form-control" id="parentId">
                    </div>
                    <div class="mb-3">
                        <label for="depth" class="form-label">부서 깊이</label>
                        <input type="number" class="form-control" id="depth" value="0">
                    </div>
                    <div class="mb-3">
                        <label for="jobNames" class="form-label">담당업무 (쉼표로 구분)</label>
                        <input type="text" class="form-control" id="jobNames" placeholder="예: 영업,고객관리">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                <button type="button" class="btn btn-primary" id="saveDepartmentBtn">저장</button>
            </div>
        </div>
    </div>
</div>

<!-- Employee Modal -->
<div class="modal fade" id="employeeModal" tabindex="-1" role="dialog" aria-labelledby="employeeModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="employeeModalLabel">직원 추가</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="employeeForm">
                    <input type="hidden" id="employeeDepartmentId">
                    <div class="mb-3">
                        <label class="form-label">부서명</label>
                        <input type="text" class="form-control" id="employeeDepartmentName" readonly>
                    </div>
                    <div class="mb-3">
                        <label for="userId" class="form-label">사용자 ID</label>
                        <input type="text" class="form-control" id="userId" required>
                    </div>
                    <div class="mb-3">
                        <label for="employeeName" class="form-label">직원명</label>
                        <input type="text" class="form-control" id="employeeName" required>
                    </div>
                    <div class="mb-3">
                        <label for="extensionNumber" class="form-label">내선번호</label>
                        <input type="text" class="form-control" id="extensionNumber">
                    </div>
                    <div class="mb-3">
                        <label for="personalPhone" class="form-label">개인 연락처</label>
                        <input type="text" class="form-control" id="personalPhone">
                    </div>
                    <div class="mb-3">
                        <label for="employeeJobNames" class="form-label">담당업무 (쉼표로 구분)</label>
                        <input type="text" class="form-control" id="employeeJobNames" placeholder="예: 영업,고객관리">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                <button type="button" class="btn btn-primary" id="saveEmployeeBtn">저장</button>
            </div>
        </div>
    </div>
</div>

</body>
</html>
