<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: header">
    <title>Hello</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
</head>
<body class="sb-nav-fixed">
<div th:replace="fragments/bodyHeader :: bodyHeader"></div>
<div id="layoutSidenav">
    <div th:replace="fragments/sidebar :: sidebar"></div>
    <div id="layoutSidenav_content">
        <main>
            <div class="container-fluid px-4">
                <h1 class="mt-4">부서 및 직원 관리</h1>
                <ol class="breadcrumb mb-4">
                </ol>
                <div class="card mb-4">
                    <div class="card-body">
                        DataTables is a third party plugin that is used to generate the demo table below. For more information about DataTables, please visit the
                        <a target="_blank" href="https://datatables.net/">official DataTables documentation</a>.
                    </div>
                </div>
                <div class="row">
                    <!-- 부서 정보 테이블 -->
                    <div class="col-full" id="departmentTablePanel">
                        <div class="card mb-4">
                            <div class="card-header">
                                <i class="fas fa-table me-1"></i>
                                부서 정보
                            </div>
                            <div class="card-body">
                                <table id="datatablesSimple" class="table table-bordered">
                                    <thead>
                                    <tr>
                                        <th>부서 ID</th>
                                        <th>부서명</th>
                                        <th>직원 수</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr th:each="department : ${departments}">
                                        <td th:text="${department.departmentId}"></td>
                                        <td th:text="${department.departmentName}"></td>
                                        <td style="text-align: center">
                                            <button type="button" class="btn btn-count btn-primary"
                                                    th:attr="data-department-id=${department.departmentId}">
                                                <span th:text="${#lists.size(department.employees)} + '명'"></span>
                                            </button>
                                        </td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    <!-- 직원 정보 슬라이드 패널 -->
                    <div class="slide-panel" id="employeeDetailsPanel">
                        <div th:each="department : ${departments}" th:attr="data-department-id=${department.departmentId}" class="employee-details-card" style="display: none;">
                            <div class="card">
                                <div class="card-header">
                                    <h5 th:text="'부서: ' + ${department.departmentName} + ' (직원 ' + ${#lists.size(department.employees)} + '명)'"></h5>
                                </div>
                                <div class="card-body">
                                    <table class="table table-striped">
                                        <thead>
                                        <tr>
                                            <th>직원 ID</th>
                                            <th>직원명</th>
                                            <th>담당 업무</th>
                                            <th>담당 지역</th>
                                        </tr>
                                        </thead>
                                        <tbody>
                                        <tr th:each="employee : ${department.employees}">
                                            <td th:text="${employee.employeeId}"></td>
                                            <td th:text="${employee.employeeName}"></td>
                                            <td>
                                                <ul>
                                                    <li th:each="job : ${employee.employeeJobs}" th:text="${job.jobName}"></li>
                                                </ul>
                                            </td>
                                            <td>
                                                <ul>
                                                    <li th:each="region : ${employee.employeeRegions}" th:text="${region.region}"></li>
                                                </ul>
                                            </td>
                                        </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>


        </main>
        <div th:replace="fragments/footer :: footer"></div>
    </div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const departmentTablePanel = document.getElementById('departmentTablePanel');
        const employeeDetailsPanel = document.getElementById('employeeDetailsPanel');
        const employeeCards = document.querySelectorAll('.employee-details-card');

        document.querySelectorAll('.btn-count').forEach(button => {
            button.addEventListener('click', function () {
                const departmentId = button.getAttribute('data-department-id');

                // col-full -> col-md-6 변경
                departmentTablePanel.classList.remove('col-full');
                departmentTablePanel.classList.add('col-md-6');

                // 모든 카드 숨기기
                employeeCards.forEach(card => {
                    card.style.display = 'none';
                });

                // 해당 부서 ID에 해당하는 카드만 표시
                const targetCard = document.querySelector(`.employee-details-card[data-department-id="${departmentId}"]`);
                if (targetCard) {
                    targetCard.style.display = 'block';
                }

                // 슬라이드 패널 애니메이션
                employeeDetailsPanel.classList.add('show');
            });
        });
    });
;

</script>

</body>
</html>
